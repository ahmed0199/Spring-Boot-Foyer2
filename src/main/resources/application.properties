spring.application.name=Foyer
spring.datasource.url=jdbc:mysql://localhost:3306/Nvfoyer?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto= update
server.port=8888
# Afficher les erreurs détaillées
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Logs Spring détaillés
logging.level.com.example.demo2=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG

# Afficher les paramètres de binding
spring.mvc.log-request-details=true

server.servlet.context-path=/foyer
